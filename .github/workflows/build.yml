name: build

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        shell: pwsh
        run: |
          dotnet restore src/DiscordRelay.Worker/DiscordRelay.Worker.csproj --runtime win-x64 --locked-mode
          dotnet restore src/DiscordRelay.Settings/DiscordRelay.Settings.csproj --runtime win-x64 --locked-mode

      - name: Build
        shell: pwsh
        run: |
          dotnet build src/DiscordRelay.Worker/DiscordRelay.Worker.csproj --configuration Release --runtime win-x64 --no-restore
          dotnet build src/DiscordRelay.Settings/DiscordRelay.Settings.csproj --configuration Release --runtime win-x64 --no-restore

      - name: Publish self-contained application
        shell: pwsh
        run: ./scripts/publish.ps1 -Version 0.0.0

      - uses: actions/upload-artifact@v4
        with:
          name: PDB-win-x64
          path: artifacts/release/*.zip
          if-no-files-found: error
